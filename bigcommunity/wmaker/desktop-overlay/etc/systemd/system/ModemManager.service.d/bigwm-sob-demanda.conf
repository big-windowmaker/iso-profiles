# Big WindowMaker: o ModemManager (~6 MiB) só sobe quando existe um possível
# modem: porta serial USB (ttyUSB/ttyACM), dispositivo QMI/MBIM (cdc-wdm) ou
# WWAN. Continua habilitado; sem modem o boot e a ativação pelo D-Bus
# (NetworkManager) o pulam. Um modem conectado depois do boot o inicia pela
# regra /etc/udev/rules.d/90-bigwm-modemmanager.rules.
[Unit]
ConditionPathExistsGlob=|/dev/ttyUSB*
ConditionPathExistsGlob=|/dev/ttyACM*
ConditionPathExistsGlob=|/dev/cdc-wdm*
ConditionPathExistsGlob=|/dev/wwan*
ConditionPathExistsGlob=|/sys/class/wwan/*
