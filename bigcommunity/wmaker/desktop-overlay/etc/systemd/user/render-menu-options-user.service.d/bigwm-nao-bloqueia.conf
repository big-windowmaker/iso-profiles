# Big WindowMaker: o render-menu-options-user.service (BigLinux) espera 10 s
# (ExecStartPre=/bin/sleep 10) como Type=oneshot e, com isso, segurava a
# fila de jobs do systemd --user por 10 s em todo login. Mesmo trabalho e
# mesma espera, agora dentro do processo (Type=exec), com prioridade baixa
# de CPU e de disco para não disputar com o começo da sessão.
[Service]
Type=exec
ExecStartPre=
ExecStart=
ExecStart=/bin/sh -c 'sleep 10; exec /usr/share/render-menu-options/render-menu-options.sh "$$1"' render-menu-options %h/.local/share/applications/
Nice=19
IOSchedulingClass=idle
