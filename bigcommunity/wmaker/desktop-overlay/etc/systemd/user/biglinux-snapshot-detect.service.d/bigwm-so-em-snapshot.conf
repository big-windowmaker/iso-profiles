# Big WindowMaker: o biglinux-snapshot-detect.service (grub-btrfs-timeshift)
# esperava 10 s (ExecStartPre=/bin/sleep 10, Type=oneshot) e abria um
# aplicativo Python + GTK 4 em todo login só para ele mesmo conferir se o
# boot foi por um snapshot do Timeshift e sair. A condição abaixo é o mesmo
# teste do aplicativo (SnapshotDetector.is_in_snapshot: o texto
# "timeshift-btrfs/snapshots" no /proc/cmdline): num boot normal a unidade é
# pulada na hora, sem a espera e sem o Python; num boot por snapshot nada
# muda.
[Service]
ExecCondition=/bin/sh -c 'grep -q timeshift-btrfs/snapshots /proc/cmdline'
