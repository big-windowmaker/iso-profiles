[Greeter]
# Tela de login da sessão live do Big WindowMaker (aparece ao sair da sessão
# live; a entrada é automática). Vem no livefs, por cima do desktopfs: lá o
# manjaro-tools troca o fundo pelo da BigCommunity
# (/usr/share/backgrounds/community/lightdm-default.jpg, que esta edição nem
# tem, e o greeter ficava cinza, com cara de GNOME) e guarda o nosso como
# slick-greeter.conf.bak.
background=/usr/share/backgrounds/big-wm/default.jpg
background-color=#505075
draw-user-backgrounds=false
draw-grid=false
theme-name=OneStepBack
icon-theme-name=hicolor
font-name=Sans 11
logo=/usr/share/icons/hicolor/64x64/apps/big-wm.png
show-hostname=true
show-power=true
show-a11y=true
show-keyboard=true
show-clock=true
clock-format=%H:%M
