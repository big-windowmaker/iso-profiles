# Big WindowMaker: tema do GRUB da ISO live no estilo "Window Maker Live".
#
# O grub.cfg compartilhado lê este arquivo logo depois do variable.cfg. O tema
# fica em themes/bigcommunity-live porque é o único diretório de tema que o
# buildiso copia para a ISO; ele é gerado no repositório big-wm por
# themes/boot/grub/gerar.sh (variante "live") e as fontes dele são carregadas
# aqui, já que o grub.cfg só carrega a Terminus do tema padrão.
for font in nimbus-sans-bold-36 nimbus-mono-bold-22 nimbus-mono-bold-13; do
    loadfont /boot/grub/themes/bigcommunity-live/${font}.pf2
done
