# Big WindowMaker: tema do GRUB no estilo da tela de boot do Window Maker
# (pacote grub-theme-big-wm). O grub-mkconfig lê este arquivo depois do
# /etc/default/grub, então o hook do grub-theme-community, que reescreve o
# GRUB_THEME de lá a cada atualização do GRUB, não desfaz esta escolha.
# Para voltar ao tema anterior: apague este arquivo e rode
#   sudo grub-mkconfig -o /boot/grub/grub.cfg
GRUB_THEME="/boot/grub/themes/big-wm/theme.txt"
